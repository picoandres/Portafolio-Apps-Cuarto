<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
    </head>

    <body>
        <header>
            <h1>CALCULADORA EN JAVASCRIPT</h1>
        </header>

        <main>
            <form id="formulario">

                <input type="number" id="segundo_numero" placeholder="Segundo número">
                <button type="submit">=</button>
                <p id="texto_resultado" style="white-space: pre-line;"></p>
            </form>
        </main>
        <script src="validaciones.js"></script>
    </body>
</html>
