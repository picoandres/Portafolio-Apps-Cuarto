<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro del cliente</title>
        <link rel="stylesheet" href="deco.css">
    </head>

    <body>
        <header>
            <h1>Ingrese sus datos</h1>
        </header>

        <main>
            <form id="formulario">
                <label for="cedula">Cédula: <strong>*</strong></label>
                <input type="text" id="cedula" maxlength="10">
                <p id="error_cedula" style="color: red;" align="center"></p>

                <label for="nombre">Nombre: <strong>*</strong></label>
                <input type="text" id="nombre" maxlength="50">
                <p id="error_nombre" style="color: red;" align="center"></p>

                <label for="direccion">Dirección: <strong>*</strong></label>
                <input type="text" id="direccion" maxlength="50">
                <p id="error_direccion" style="color: red;" align="center"></p>

                <label for="celular">Celular: <strong>*</strong></label>
                <input type="tel" id="celular" maxlength="10">
                <p id="error_celular" style="color: red;" align="center"></p>

                <label for="correo">Correo: <strong>*</strong></label>
                <input type="email" id="correo" maxlength="50">
                <p id="error_correo" style="color: red;" align="center"></p>

                <button type="submit">Registrar</button>
            </form>
        </main>
        <script src="validaciones.js"></script>
    </body>
</html>
